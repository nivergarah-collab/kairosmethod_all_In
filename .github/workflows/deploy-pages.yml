# Preparado para publicar portal + prototipos web al estar implementados y enlazados.
# Requiere: Settings > Pages > Source = "GitHub Actions" (el repo debe ser público en plan gratuito).
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'web/portal/**'
      - '!web/portal/README.md'
      - 'apps/prototypes/**'
      - '!apps/prototypes/**/README.md'
      - 'infra/scripts/build-site.sh'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ vars.PAGES_REQUIRED_PROTOTYPES != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: BASE_PATH="/${GITHUB_REPOSITORY#*/}" REQUIRED_PROTOTYPES="$REQUIRED_PROTOTYPES" bash ./infra/scripts/build-site.sh
        env:
          REQUIRED_PROTOTYPES: ${{ vars.PAGES_REQUIRED_PROTOTYPES }}
      - name: Verify Pages artifact is complete
        run: test -s dist/index.html && test -d dist/prototypes
      # PWA (instalable como aplicación). Paso opcional y a prueba de fallos: si el script falla,
      # se publica la página sin PWA y se avisa en el log. Para revertir: borrar este paso.
      - name: Inyectar PWA
        continue-on-error: true
        run: |
          if node infra/app/inject-pwa.mjs --dir dist --base "/${GITHUB_REPOSITORY#*/}" && test -s dist/manifest.webmanifest; then
            echo "PWA inyectada en dist/."
          else
            echo "::warning::No se pudo inyectar la PWA; se publica la página sin ella."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ vars.PAGES_REQUIRED_PROTOTYPES != '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
