# Genera el apk (Capacitor) con el MISMO sitio que publica Pages y lo deja en el Release móvil `apk-latest`.
# Workflow independiente de deploy-pages.yml: si el apk falla, Pages no se ve afectado.
# Detalle y uso: mobile/README.md
name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'web/portal/**'
      - '!web/portal/README.md'
      - 'apps/prototypes/**'
      - '!apps/prototypes/**/README.md'
      - 'infra/scripts/build-site.sh'
      - 'mobile/**'
      - '!mobile/README.md'
      - '!mobile/PLAN-APK.md'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    # Misma condición que Pages: sin la lista de prototipos no hay sitio que empaquetar.
    if: ${{ vars.PAGES_REQUIRED_PROTOTYPES != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Opcionales: si existen los cuatro, el apk sale firmado con tu clave (se instala encima del anterior).
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Mismo build que Pages, pero con el sitio en la raíz (base "/"): dentro del apk la WebView sirve desde su propio origen.
      - name: Construir el sitio
        run: BASE_PATH="" REQUIRED_PROTOTYPES="$REQUIRED_PROTOTYPES" bash ./infra/scripts/build-site.sh
        env:
          REQUIRED_PROTOTYPES: ${{ vars.PAGES_REQUIRED_PROTOTYPES }}

      - name: Verificar el sitio
        run: test -s dist/index.html && test -d dist/prototypes

      - name: Preparar Capacitor
        working-directory: mobile
        run: |
          npm ci
          npm test
          node scripts/prepare-web.mjs ../dist www
          npx cap add android
          npx cap sync android
          node scripts/set-version.mjs android/app/build.gradle "$GITHUB_RUN_NUMBER" "$(node -p "require('./package.json').version")-${GITHUB_SHA::7}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar el apk
        working-directory: mobile/android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          mkdir -p "$GITHUB_WORKSPACE/out"
          SHORT="${GITHUB_SHA::7}"
          REPO="${GITHUB_REPOSITORY#*/}"
          NAME="kairos-${REPO}-${SHORT}.apk"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "Firma propia detectada: assembleRelease + apksigner."
            ./gradlew --no-daemon assembleRelease
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KS_ALIAS" \
              --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "$GITHUB_WORKSPACE/out/$NAME" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify "$GITHUB_WORKSPACE/out/$NAME"
            rm -f "$RUNNER_TEMP/release.keystore"
          else
            echo "Sin secretos de firma: apk debug (clave distinta en cada build; Android pedirá desinstalar antes de actualizar)."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/$NAME"
          fi
          cp "$GITHUB_WORKSPACE/out/$NAME" "$GITHUB_WORKSPACE/out/kairos-latest.apk"
          ls -l "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: kairos-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      # Release móvil con etiqueta fija: se recrea en cada build para que apunte al commit actual y tenga un solo apk.
      - name: Publicar en el Release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          SIGN="debug (clave distinta en cada build)"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ] && [ -n "$KEY_PASS" ]; then SIGN="firmado con la clave del equipo"; fi
          gh release delete apk-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create apk-latest out/*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "APK más reciente (${SHORT})" \
            --notes "Apk generado automáticamente desde main (commit ${SHORT}). Firma: ${SIGN}. Descarga kairos-latest.apk. Guía: mobile/README.md"
